    <h1>Payment Details</h1>
    
    <form  class="formpayment" action="process_payment.php" method="post">
        <!-- Cardholder Name -->
        <label for="cardholder-name">Cardholder Name:</label>
        <input class="inputpayment" type="text" id="cardholder-name" name="cardholder-name" required><br>

        <!-- Card Number -->
        <label for="card-number">Card Number:</label>
        <input class="inputpayment" type="text" id="card-number" name="card-number" pattern="[0-9]{13,16}" required><br>

        <!-- Expiration Date -->
        <label for="expiration-date">Expiration Date :</label>
        <input  class="inputpayment" type="text" id="expiration-date" name="expiration-date" pattern="(0[1-9]|1[0-2])\/[0-9]{2}" required placeholder="MM/YY"><br>
        

        <!-- CVV -->
        <label for="cvv">CVV:</label>
        <input class="inputpayment" type="text" id="cvv" name="cvv" pattern="[0-9]{3,4}" required><br>

        <!-- Billing Address -->
        <label for="billing-address">Billing Address:</label>
        <input class="inputpayment" type="text" id="billing-address" name="billing-address" required><br>

        <!-- Amount -->
        <label for="amount">Amount:</label>
        <input class="inputpayment" type="text" id="amount" name="amount" required><br>

        <!-- Submit Button -->
        <center><button type="submit" class="loginbutton">Make Payment</button></center>
    </form>
